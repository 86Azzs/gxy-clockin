name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf automake libtool libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses5-dev libffi-dev cmake libssl-dev
          pip3 install --upgrade buildozer cython

      - name: Restore keystore
        run: |
          echo "$KEYSTORE_B64" | base64 -d > gxy-release.keystore
          ls -la gxy-release.keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Build signed release APK
        env:
          ACLOCAL_PATH: /usr/share/aclocal
          P4A_RELEASE_KEYSTORE: gxy-release.keystore
          P4A_RELEASE_KEYALIAS: gongxueyun
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEYSTORE_PASSWD }}
        run: |
          LIC="24333f8a63b6825ea9c5514f83c2829b004d1fee"
          buildozer android debug || true
          SDKROOT="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDKROOT" ]; then
            mkdir -p "$SDKROOT/licenses"
            printf '%s\n' "$LIC" > "$SDKROOT/licenses/android-sdk-license"
            mkdir -p "$HOME/.android/licenses"
            printf '%s\n' "$LIC" > "$HOME/.android/licenses/android-sdk-license"
            SDKMGR=$(find "$SDKROOT" -name sdkmanager -type f | head -1)
            if [ -n "$SDKMGR" ]; then
              yes | "$SDKMGR" --sdk_root="$SDKROOT" "build-tools;37.0.0" platforms android-33 > /dev/null 2>&1 || true
            fi
          fi
          buildozer android release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gxy-apk-release
          path: bin/*.apk
          retention-days: 30
