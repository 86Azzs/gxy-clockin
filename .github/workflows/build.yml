name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev cmake libssl-dev
          pip3 install --upgrade buildozer cython

      - name: Build APK
        run: |
          LIC="24333f8a63b6825ea9c5514f83c2829b004d1fee"
          # 第一次运行：下载 SDK/NDK（build-tools 会因 license 缺失而失败，可容忍）
          buildozer android debug || true
          # 定位 SDK 根目录并写入 license
          SDKROOT="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDKROOT" ]; then
            mkdir -p "$SDKROOT/licenses"
            printf '%s\n' "$LIC" > "$SDKROOT/licenses/android-sdk-license"
            mkdir -p "$HOME/.android/licenses"
            printf '%s\n' "$LIC" > "$HOME/.android/licenses/android-sdk-license"
            # 尝试用 sdkmanager 显式安装 build-tools 并接受 license
            SDKMGR=$(find "$SDKROOT" -name sdkmanager -type f | head -1)
            if [ -n "$SDKMGR" ]; then
              yes | "$SDKMGR" --sdk_root="$SDKROOT" "build-tools;37.0.0" platforms android-33 > /dev/null 2>&1 || true
            fi
          fi
          # 第二次运行：正式构建
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gxy-apk
          path: bin/*.apk
          retention-days: 30
