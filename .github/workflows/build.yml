name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev cmake libssl-dev
          pip3 install --upgrade buildozer cython

      - name: Build APK
        run: |
          buildozer android debug || true
          find "$HOME/.buildozer" -name sdkmanager -type f | head -1 | while read s; do yes | "$s" --licenses || true; done
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gxy-apk
          path: bin/*.apk
          retention-days: 30
